.opt.on{ border-color:var(--accent); background:var(--surface-2); }

.tip a{ color:inherit; font-weight:600; text-decoration:none; border-bottom:1px solid currentColor; white-space:nowrap; font-variant-numeric:tabular-nums; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
};
const accentOf = z => isDark() ? z.cd : z.c;
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const lenOf = m => m >= 60 ? (m%60 ? `${Math.floor(m/60)}시간 ${m%60}분` : `${Math.floor(m/60)}시간`) : `${m}분`;
const mapUrl = q => "https://map.naver.com/p/search/" + encodeURIComponent(q);
const dowOf = ds => new Date(ds + "T00:00:00").getDay();
const niceDate = ds => { const d = new Date(ds + "T00:00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };

function searchQ(o, zoneId){
  if (o.q) return o.q;
  if (QFIX[o.nm]) return QFIX[o.nm];
  const a = AREA[zoneId];
  if (!a) return o.nm;
  return o.nm.indexOf(a) > -1 ? o.nm : a + " " + o.nm;
}
const isClosed = o => Array.isArray(o.cl) && o.cl.indexOf(dowOf(theDate)) > -1;

function listFor(slot, all){
  if (sel.zone === null) return [];
  const z = ZONES[sel.zone];
  const mine = extra.filter(p => p.zone === z.id && p.slot === slot);
  const rows = z[slot].concat(mine).map(o => {
    const key = KEY_OF(o, z.id, slot);
    return Object.assign({}, o, { key, hid: hidden.indexOf(key) > -1, shut: isClosed(o) });
  });
  return all ? rows : rows.filter(o => !o.hid && !o.shut);
}
function findByKey(slot, key){
  if (!key) return null;
  return listFor(slot, true).filter(o => o.key === key)[0] || null;
}
function setAccent(){
  const root = document.documentElement;
  if (sel.zone === null) root.style.removeProperty("--accent");
  else root.style.setProperty("--accent", accentOf(ZONES[sel.zone]));
}
function metaOf(o){ return [o.n, o.h, o.dur ? lenOf(o.dur) : ""].filter(Boolean).join(" · "); }
function badges(o){ return o.u ? '<span class="kind warn">시간 미확인</span>' : ""; }

  $("prog").style.width = `${step / STEPS.length * 100}%`;
  $("back").style.visibility = step === 0 ? "hidden" : "visible";

  const Q = QUESTIONS[key];

          ${m.meta?`<span class="meta">${esc(m.meta)}</span>`:""}
        </span><span class="side"></span>
      </button>`).join("");
  } else {
    const zid = ZONES[sel.zone].id;
    const all = listFor(key, true);
    const shutCount = all.filter(o => o.shut && !o.hid).length;
    const items = editMode ? all : all.filter(o => !o.hid && !o.shut);
    if (shutCount && !editMode) note = `<p class="q-sub">${DOW[dowOf(theDate)]}요일 휴무 ${shutCount}곳은 목록에서 뺐어.</p>`;

    rows = items.map(o => {
      const on = multi ? sel.day.includes(o.key) : sel[key] === o.key;

      const link = (o.k && o.k !== "none")
        ? `<a class="go" href="${esc(mapUrl(searchQ(o, zid)))}" target="_blank" rel="noopener" aria-label="${esc(o.nm)} 지도">↗</a>` : "";
      const edit = editMode
        ? (o.hid
            ? `<button class="go" data-undo="${esc(o.key)}" aria-label="되살리기">↺</button>`
            : `<button class="go" data-edit="${esc(o.key)}" aria-label="고치기">✎</button>`
              + `<button class="go del" data-del="${esc(o.key)}" data-id="${esc(o.id||"")}" aria-label="빼기">✕</button>`)
        : "";
      const shutTag = o.shut ? `<span class="kind warn">${DOW[dowOf(theDate)]} 휴무</span>` : "";
      return `<button class="opt${on?" on":""}${(o.hid||o.shut)?" gone":""}" data-k="${esc(o.key)}">

          <span class="hd">${kl?`<span class="kind">${esc(kl)}</span>`:""}${shutTag}${badges(o)}<span class="nm">${esc(o.nm)}</span></span>
          ${metaOf(o)?`<span class="meta">${esc(metaOf(o))}</span>`:""}
        </span>
        <span class="side">${link}${edit}${(multi&&!editMode)?'<span class="mark">&#10003;</span>':""}</span>
      </button>`;
    }).join("");
    rows += formOpen ? formHtml(key, editKey ? findByKey(key, editKey) : null)
      : `<div class="tools">
           <button class="addbtn" id="openForm">＋ 직접 추가</button>
           <button class="addbtn slim" id="editTog">${editMode?"편집 끝":"고치기 · 빼기"}</button>
         </div>`;
  }

  $("stage").innerHTML = `
    ${savedHtml}
    <h1 class="q">${esc(Q.q)}</h1>
    ${Q.sub?`<p class="q-sub">${esc(Q.sub)}</p>`:""}
    ${note}
    ${editMode&&key!=="zone"&&key!=="movie"?'<p class="q-sub">✎ 로 고치고, ✕ 로 빼. ↺ 는 되살리기.</p>':""}
    <div class="opts">${rows}</div>
    ${(multi&&!editMode)?`<div class="actions"><button class="btn" id="next">다음</button></div>`:""}`;

  document.querySelectorAll(".opt").forEach(b => {
    b.addEventListener("click", e => {
      if (e.target.closest(".go")) return;
      if (editMode) return;
      const k = b.dataset.k;
      if (key === "zone"){
        const i = +k;
        if (sel.zone !== i){ sel = blankSel(); sel.zone = i; }
        formOpen = false; advance(); return;
      }
      if (key === "movie"){ sel.movie = +k; formOpen = false; advance(); return; }
      if (multi){
        const at = sel.day.indexOf(k);
        if (at > -1) sel.day.splice(at,1); else if (sel.day.length < 2) sel.day.push(k);
        render();
      } else { sel[key] = k; formOpen = false; advance(); }
    });
  });
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); removeItem(b.dataset.del, b.dataset.id); }));
  document.querySelectorAll("[data-undo]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); restoreItem(b.dataset.undo); }));
  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); editKey = b.dataset.edit; formOpen = true; render(); }));
  document.querySelectorAll("[data-delplan]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); delPlan(b.dataset.delplan); }));
  document.querySelectorAll("[data-plan]").forEach(b => b.addEventListener("click", e => { if (e.target.closest("[data-delplan]")) return; loadPlan(b.dataset.plan); }));
  if (multi && !editMode && $("next")) $("next").addEventListener("click", advance);
  if ($("openForm")) $("openForm").addEventListener("click", () => { editKey = null; formOpen = true; render(); });
  if ($("editTog")) $("editTog").addEventListener("click", () => { editMode = !editMode; editKey = null; formOpen = false; render(); });
  if (formOpen) wireForm(key);
}

function dropFromSel(key){
  ["lunch","dinner","night"].forEach(s => { if (sel[s] === key) sel[s] = null; });
  const at = sel.day.indexOf(key);
  if (at > -1) sel.day.splice(at,1);
}
function removeItem(key, id){
  dropFromSel(key);
  if (id){
    if (db && id.indexOf("local-") !== 0) db.doc("places/" + id).delete().catch(()=>{});
    extra = extra.filter(p => p.id !== id);
  } else {
    if (hidden.indexOf(key) === -1) hidden.push(key);
    if (db) db.collection("hidden").add({ key, createdAt:new Date().toISOString() }).catch(()=>{});
  }
  if (!db) saveLocal();
  render();
}
function restoreItem(key){
  hidden = hidden.filter(k => k !== key);
  if (db){
    db.collection("hidden").where("key","==",key).get()
      .then(s => s.docs.forEach(d => db.doc("hidden/" + d.id).delete().catch(()=>{}))).catch(()=>{});
  } else saveLocal();
  render();
}

function formHtml(slot, o){
  const v = o || {}; const sv = s => esc(s == null ? "" : s);
  const cl = Array.isArray(v.cl) ? v.cl : [];
  return `<div class="form">
    <div class="row">
      <label>이름<input type="text" id="f-nm" value="${sv(v.nm)}" placeholder="가게·장소 이름"></label>
      <label>종류<select id="f-k">
        ${Object.keys(KIND).filter(k=>k!=="none").map(k=>`<option value="${k}"${v.k===k?" selected":""}>${KIND[k]}</option>`).join("")}
      </select></label>
    </div>
    <label>영업시간<input type="text" id="f-h" value="${sv(v.h)}" placeholder="예: 11:00–21:00"></label>
    <label>휴무 요일<span class="dows">${DOW.map((d,i)=>
      `<label><input type="checkbox" id="f-cl-${i}"${cl.indexOf(i)>-1?" checked":""}>${d}</label>`).join("")}</span></label>
    <label>메모<input type="text" id="f-n" value="${sv(v.n)}" placeholder="예: 예약 권장 / 웨이팅"></label>
    <div class="row">
      <label>머무는 시간(분)<input type="text" id="f-dur" inputmode="numeric" value="${v.dur||""}" placeholder="60"></label>
      <label>이동 시간(분)<input type="text" id="f-m" inputmode="numeric" value="${v.m||""}" placeholder="10"></label>
    </div>
    <label>지도 검색어<input type="text" id="f-q" value="${sv(v.q || (o ? searchQ(o, ZONES[sel.zone].id) : ""))}" placeholder="비우면 동네+이름으로 검색"></label>
    <div class="actions" style="margin-top:2px">
      <button class="btn ghost" id="f-cancel">취소</button>
      <button class="btn" id="f-save">${o ? "저장" : esc(SLOTS[slot]) + "에 추가"}</button>
    </div>
    <p class="msg" id="f-msg"></p>
  </div>`;
}
function closeForm(){ formOpen = false; editKey = null; render(); }

function wireForm(slot){
  const target = editKey ? findByKey(slot, editKey) : null;
  $("f-cancel").addEventListener("click", closeForm);
  $("f-save").addEventListener("click", () => {
    const nm = $("f-nm").value.trim();
    if (!nm){ $("f-msg").textContent = "이름을 입력해."; return; }
    const cl = []; for (let i=0;i<7;i++) if ($("f-cl-"+i).checked) cl.push(i);
    const doc = {
      zone: ZONES[sel.zone].id, slot, nm,
      k: $("f-k").value, h: $("f-h").value.trim(), n: $("f-n").value.trim(), cl,
      dur: Math.max(0, parseInt($("f-dur").value, 10) || 60),
      m: Math.max(0, parseInt($("f-m").value, 10) || 10),
      q: $("f-q").value.trim(),
      createdAt: (target && target.createdAt) || new Date().toISOString()
    };
    if (target && target.id && db && target.id.indexOf("local-") !== 0){
      $("f-msg").textContent = "저장 중…";
      db.doc("places/" + target.id).update(doc).then(closeForm).catch(()=>{ $("f-msg").textContent="저장 실패."; });
      return;
    }
    if (target && target.id){
      extra = extra.map(p => p.id === target.id ? Object.assign({ id:target.id }, doc) : p);
      saveLocal(); closeForm(); return;
    }
    if (target && !target.id){
      if (hidden.indexOf(target.key) === -1) hidden.push(target.key);
      if (db) db.collection("hidden").add({ key:target.key, createdAt:new Date().toISOString() }).catch(()=>{});
      dropFromSel(target.key);
    }
    if (!db){
      extra.push(Object.assign({ id:"local-" + Date.now() }, doc));
      saveLocal(); closeForm(); return;
    }
    $("f-msg").textContent = "저장 중…";
    db.collection("places").add(doc).then(closeForm).catch(()=>{
      extra.push(Object.assign({ id:"local-" + Date.now() }, doc));
      saveLocal(); closeForm();
    });
  });
}

function advance(){
  step++;
  if (step >= STEPS.length) renderResult();
  else { render(); window.scrollTo(0,0); }
}
$("back").addEventListener("click", () => { if (step > 0){ step--; formOpen = false; editKey = null; render(); window.scrollTo(0,0); } });

/* ===== 저장한 코스 ===== */
function savePlan(){
  const z = ZONES[sel.zone];
  const p = { date: theDate, zone: z.id, zoneNm: z.nm,
    title: `${niceDate(theDate)} ${z.nm}`,
    lunch: sel.lunch, day: sel.day.slice(), movie: sel.movie,
    dinner: sel.dinner, night: sel.night, createdAt: new Date().toISOString() };
  if (db){
    db.collection("plans").add(p).catch(()=>{ plans.push(Object.assign({id:"local-"+Date.now()}, p)); saveLocal(); });
  } else { plans.push(Object.assign({id:"local-"+Date.now()}, p)); saveLocal(); }
  const btn = $("savePlan"); if (btn){ btn.textContent = "저장됨"; btn.disabled = true; }
}
function delPlan(id){
  if (db && id.indexOf("local-") !== 0) db.doc("plans/" + id).delete().catch(()=>{});
  plans = plans.filter(p => p.id !== id);
  if (!db) saveLocal();
  render();
}
function loadPlan(id){
  const p = plans.filter(x => x.id === id)[0];
  if (!p) return;
  const zi = ZONES.findIndex(z => z.id === p.zone);
  if (zi < 0) return;
  theDate = p.date;
  sel = { zone: zi, lunch: p.lunch, day: (p.day||[]).slice(), movie: p.movie, dinner: p.dinner, night: p.night };
  step = STEPS.length;
  renderResult();
}

/* ===== result ===== */
function chosen(){
  const out = [];
  const a = findByKey("lunch", sel.lunch); if (a) out.push(a);
  sel.day.forEach(k => { const o = findByKey("day", k); if (o) out.push(o); });
  const b = findByKey("dinner", sel.dinner); if (b) out.push(b);
  const c = findByKey("night", sel.night); if (c) out.push(c);
  return out;
}
function buildRows(){
  const z = ZONES[sel.zone];
  const rows = []; let t = 12 * 60;
  rows.push({ t, nm:z.meet, k:"", move:true, meet:true, q:z.meet });
  const seq = [];
  const L = findByKey("lunch", sel.lunch); if (L) seq.push(L);
  sel.day.forEach(k => { const o = findByKey("day", k); if (o) seq.push(o); });
  const mv = MOVIES[sel.movie];
  if (mv && mv.dur > 0) seq.push({ k:"movie", nm:`${mv.nm} · ${z.cine}`, h:mv.meta, dur:mv.dur, m:z.cm, q:z.cine });
  const N = findByKey("dinner", sel.dinner); if (N) seq.push(N);
  const G = findByKey("night", sel.night); if (G && G.dur > 0) seq.push(G);
  seq.forEach((o, idx) => {
    const mm = idx === 0 ? 10 : (o.m || 0);
    if (mm > 0){ rows.push({ t, nm:`이동 ${mm}분`, move:true }); t += mm; }
    rows.push({ t, nm:o.nm, k:o.k, h:o.h, n:o.n, dur:o.dur, u:o.u, shut:o.shut, q:searchQ(o, z.id) });
    t += o.dur;
  });
  return { rows, end:t, zone:z };
}

function renderResult(){
  setAccent(); renderHead();
  const { rows, end, zone } = buildRows();
  const picked = chosen();
  const tipKeys = [];
  picked.forEach(o => { if (o.tip && !tipKeys.includes(o.tip)) tipKeys.push(o.tip); });
  const shutNow = picked.filter(o => o.shut).map(o => o.nm);

  $("count").textContent = "완성";
  $("prog").style.width = "100%";
  $("back").style.visibility = "visible";

  $("stage").innerHTML = `
    <div class="res-head">
      <div class="zone">${esc(zone.nm)}</div>
      <h2>${esc(niceDate(theDate))}</h2>
      <div class="range">12:00 – ${fmt(end)} · 총 ${lenOf(end - 720)}</div>
    </div>
    <div class="plan">
      ${rows.map(r => {
        const kl = KIND[r.k] || "";
        const meta = [r.n, r.h, r.dur ? lenOf(r.dur) : ""].filter(Boolean).join(" · ");
        const link = (r.move && !r.meet) ? "" :
          `<a class="go" href="${esc(mapUrl(r.q))}" target="_blank" rel="noopener" aria-label="${esc(r.nm)} 지도">↗</a>`;
        return `<div class="stop${r.move?" is-move":""}">
          <div class="t">${fmt(r.t)}</div>
          <div class="rail"><i></i></div>
          <div>
            <div class="hd">${kl?`<span class="kind">${esc(kl)}</span>`:""}${r.shut?`<span class="kind warn">휴무</span>`:""}${r.u?'<span class="kind warn">시간 미확인</span>':""}<span class="nm">${esc(r.nm)}</span></div>
            ${meta?`<div class="meta">${esc(meta)}</div>`:""}
          </div>
          <div>${link}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="tips">
      ${shutNow.length?`<div class="tip"><span class="k">휴무</span><div>이 날짜엔 <b>${esc(shutNow.join(", "))}</b>가 쉬어. 날짜를 바꾸거나 다른 곳으로.</div></div>`:""}
      ${tipKeys.map(k => `<div class="tip"><span class="k">${TIPS[k].k}</span><div>${TIPS[k].html}</div></div>`).join("")}
      <div class="tip"><span class="k">영업</span><div>표시된 시간은 <b>평시 기준</b>이야. 명절·연휴엔 다를 수 있으니 확인하고 가.</div></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="again">처음부터</button>
      <button class="btn" id="savePlan">이 코스 저장</button>
    </div>`;

  $("again").addEventListener("click", () => {
    sel = blankSel(); step = 0; formOpen = false; editMode = false; editKey = null;
    render(); window.scrollTo(0,0);
  });
  $("savePlan").addEventListener("click", savePlan);
  window.scrollTo(0,0);
}

/* ===== boot ===== */
extra  = LS.get("dayplan.extra", []);
hidden = LS.get("dayplan.hidden", []);
plans  = LS.get("dayplan.plans", []);
render();

(window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null))
  .then(store => {
    if (!store) return;
    db = store; extra = []; hidden = []; plans = [];
    db.collection("places").orderBy("createdAt").onSnapshot(
      s => { extra = s.docs.map(d => Object.assign({ id:d.id }, d.data() || {})); if (step < STEPS.length) render(); }, ()=>{});
    db.collection("hidden").onSnapshot(
      s => { hidden = s.docs.map(d => (d.data()||{}).key).filter(Boolean); if (step < STEPS.length) render(); }, ()=>{});
    db.collection("plans").orderBy("createdAt").onSnapshot(
      s => { plans = s.docs.map(d => Object.assign({ id:d.id }, d.data() || {})); if (step < STEPS.length) render(); }, ()=>{});
    db.collection("weather").onSnapshot(
      s => { weather = {}; s.docs.forEach(d => { const v = d.data()||{}; if (v.text) weather[d.id] = v.text; }); renderHead(); }, ()=>{});
  }).catch(()=>{});

if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (step >= STEPS.length) renderResult(); else render();
  });
}
</script>
